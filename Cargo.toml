[package]
name = "suisuiview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "suisuiview"

[features]
default = []
bench-native = [
    "bench-native-jpeg-turbo",
    "bench-native-webp",
    "bench-native-wuffs",
]
bench-native-jpeg-turbo = ["dep:turbojpeg"]
bench-native-webp = ["native-webp"]
bench-native-wuffs = ["dep:wuffs-sys"]
bench-avif-native = ["image/avif-native"]
bench-libavif-native = ["native-avif"]
bench-svg = ["dep:resvg"]
bench-all = [
    "bench-native",
    "bench-svg",
]
native-webp = ["dep:webp"]
native-avif = ["dep:libavif"]
native-ai = ["dep:pdfium-render"]
perf-dev = []
perf-diagnostics = []

[dependencies]
arboard = "3.6"
blake3 = "1.5"
bytemuck = { version = "1.24", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6.0"
eframe = { version = "0.32", features = ["wgpu"] }
egui-wgpu = "0.32.3"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
gif = "0.14"
image-webp = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
lcms2 = "6.1"
lru = "0.12"
png = "0.18"
pollster = "0.4"
pdfium-render = { version = "0.9", optional = true, default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
rfd = "0.15"
resvg = { version = "0.47", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
trash = "5.2"
libavif = { version = "0.14", optional = true, default-features = false, features = ["codec-dav1d"] }
turbojpeg = { version = "1.3.3", optional = true }
webp = { version = "0.3", optional = true, default-features = false }
wgpu = "25.0.2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
wuffs-sys = { version = "0.1", optional = true }
zip = "2.2"
zune-core = "0.5"
zune-jpeg = "0.5"
zune-png = "0.5"
zune-psd = "0.5"

[patch.crates-io]
wuffs-sys = { path = "third_party/wuffs-sys" }

[build-dependencies]
winresource = "0.1"
