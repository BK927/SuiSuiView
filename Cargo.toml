[package]
name = "suisuiview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "suisuiview"

[features]
default = ["native-webp"]
bench-native = [
    "bench-native-jpeg-turbo",
    "bench-native-webp",
]
bench-native-jpeg-turbo = ["dep:turbojpeg"]
bench-native-webp = ["native-webp"]
bench-avif-native = ["image/avif-native"]
bench-libavif-native = ["native-avif"]
bench-svg = ["dep:resvg"]
bench-all = [
    "bench-native",
    "bench-svg",
]
native-webp = ["dep:libwebp-sys", "dep:webp"]
native-avif = ["dep:libavif"]
native-ai = ["dep:pdfium-render"]
perf-dev = []
perf-diagnostics = []
runtime-probe = []

[[bin]]
name = "suisuiview-runtime-probe"
path = "src/bin/suisuiview-runtime-probe.rs"
required-features = ["runtime-probe"]

[dependencies]
arboard = "3.6"
blake3 = "1.5"
bytemuck = { version = "1.24", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6.0"
egui = { version = "0.32.3", features = ["default_fonts"] }
egui-wgpu = { version = "0.32.3", default-features = false, features = ["winit"] }
egui-winit = "0.32.3"
egui_glow = { version = "0.32.3", features = ["winit"] }
fast_image_resize = { version = "6.0", default-features = false, features = ["std", "only_u8x4"] }
glow = "0.16"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
gif = "0.14"
image-webp = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
lcms2 = "6.1"
lru = "0.12"
png = "0.18"
pollster = "0.4"
pdfium-render = { version = "0.9", optional = true, default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
rfd = "0.15"
resvg = { version = "0.47", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
trash = "5.2"
libavif = { version = "0.14", optional = true, default-features = false, features = ["codec-dav1d"] }
turbojpeg = { version = "1.3.3", optional = true }
webp = { version = "0.3", optional = true, default-features = false }
libwebp-sys = { version = "0.9.6", optional = true, default-features = false }
wgpu = { version = "25.0.2", default-features = false, features = ["vulkan", "gles", "metal", "wgsl"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = "2.2"
zune-core = "0.5"
zune-jpeg = "0.5"
zune-png = "0.5"
zune-psd = "0.5"

[build-dependencies]
winresource = "0.1"

# winit 0.30.13 + the 0.30.x backport of rust-windowing/winit#4341 ("use the
# WM_DPICHANGED suggested rect directly on Windows 11"), which upstream merged
# 2025-08 but has not released (0.31 is still beta and egui-winit — through
# 0.35 — pins winit ^0.30.13). Fixes the mixed-DPI drag jitter/grip-slip and
# the windowed-reveal teleport race on this codebase's 150%/125% desktop.
# DELETE this patch the moment egui moves to a winit release that contains the
# fix (egui-winit requiring winit >= 0.31); the fork is that release's early
# adoption, not a divergence.
[patch.crates-io]
winit = { git = "https://github.com/BK927/winit", rev = "313e5c26b5c1a72661615b7aa2fda0a0d0a5fe96" }
