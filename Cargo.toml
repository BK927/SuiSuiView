[package]
name = "suisuiview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "suisuiview"

[features]
default = []
perf-dev = []
perf-diagnostics = []

[dependencies]
arboard = "3.6"
blake3 = "1.5"
bytemuck = { version = "1.24", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6.0"
eframe = { version = "0.32", features = ["wgpu"] }
egui-wgpu = "0.32.3"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
gif = "0.14"
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
lcms2 = "6.1"
lru = "0.12"
png = "0.18"
pollster = "0.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
trash = "5.2"
wgpu = "25.0.2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
zip = "2.2"

[build-dependencies]
winresource = "0.1"
