schema_version = 1

[defaults]
source_globs = ["src/**/*.rs"]
# Recalibrated 2026-07-27 against the measured distribution of the 197 non-legacy
# source files: >600 caught 38 of them (19%) and >800 caught 16, with two sitting
# at 896 and 899 — the old 900 failure line ran straight through the middle of the
# codebase's natural module size, so files converged just under it and a routine
# fix tipped two over at once. A warning that fires on a fifth of the tree is
# background noise, which is why that drift went unseen.
#
# 850 warns on 5 files today: a list short enough to read, and the runway that was
# missing in front of the cliff. 1100 fails on none, and matches the size this
# repository already accepts in practice — the legacy-large ratchets below sit at
# 1151, 1321, 1328, 1510, and 1552.
#
# Real pressure on chronic files comes from those per-file ratchets, not from this
# global budget. Re-measure before moving these again; do not raise them to clear
# a specific failure.
new_file_warn_lines = 850
new_file_fail_lines = 1100
bad_module_names = ["utils.rs", "helpers.rs", "misc.rs"]
allowed_bad_module_paths = []

[[files]]
path = "src/app.rs"
kind = "legacy-large"
baseline_lines = 2309
growth_warn_lines = 100
growth_fail_lines = 200
purpose = "Application shell, durable SuiSuiViewApp state, and top-level egui update orchestration."
allowed_growth = [
  "SuiSuiViewApp state fields that are genuinely cross-cutting.",
  "Top-level egui update orchestration (update_frame driven by the winit host).",
  "Small wiring needed while extracting app submodules."
]
remediation = [
  "Move keyboard commands and shortcut mapping to src/app/commands.rs.",
  "Move toolbar, status bar, context menu, and settings UI to src/app/ui/.",
  "Move viewer layout, spread math, pointer handling, and painting to src/app/viewer.rs or src/app/render.rs.",
  "Move session-only image transforms and filters to src/app/effects.rs.",
  "Move clipboard, dialogs, file manager, fonts, and window-level integration to src/app/platform.rs."
]

[[files]]
path = "src/core/worker.rs"
kind = "legacy-large"
baseline_lines = 192
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "Page worker orchestration, public worker-facing decode API, shared image preparation, and metadata policy."
allowed_growth = [
  "Worker command/event orchestration.",
  "Public worker API types that are shared by app, perf, and quality flows.",
  "Small wiring needed while extracting worker submodules."
]
remediation = [
  "Keep format-specific JPEG, PNG, BMP, and GIF decode changes in src/core/worker/{jpeg,png,bmp,gif}.rs.",
  "Move EXIF and ICC handling to src/core/worker/metadata.rs.",
  "Move prefetch ordering and visible-page job selection to src/core/worker/scheduler.rs.",
  "Move worker cache sizing, pruning, and cache-key helpers to src/core/worker/cache.rs."
]

# Chronically-large established files: registered as legacy-large ratchets at
# their current size (accept the size, forbid further growth) instead of being
# carried by perpetually-renewed temporary waivers. Split per the remediation
# when the referenced work settles, then lower the baseline.

[[files]]
path = "src/app/gpu_paint/mod.rs"
kind = "legacy-large"
baseline_lines = 527
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "WGPU paint bridge coordination: public surface, egui-wgpu callbacks, display-upscaler settings/env parsing, and shared types. Pool bookkeeping lives in pools.rs and render-pass preparation in passes.rs."
remediation = [
  "GPU pool/cache bookkeeping and render-pass preparation are already split into pools.rs and passes.rs; keep new code in the matching module."
]

[[files]]
path = "src/app/gpu_paint/passes.rs"
kind = "legacy-large"
# Re-baselined at current size for V12 (fp16 intermediate chain + output dither):
# the file sat at 1118/960 (158 of 160 allowed) before, so the dither flag wiring
# through the final-composite draw states could not fit under the stale ratchet.
baseline_lines = 1151
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "Render-pass preparation and recording for the WGPU paint bridge."

[[files]]
path = "src/app/gpu_paint/tests.rs"
kind = "legacy-large"
# Re-baselined at current size for V15 (per-slot params-buffer recycle + source-pool
# pass shield): the required offscreen recycle test (prepare/insert/render-readback
# to prove write_buffer landed) plus the source-shield device test pushed the module
# past the V12 ratchet. Its unit tests and the real-device render harness share
# private helpers (smoke_device, DownscaleSmokeFixture, capture_gpu_frame), so
# splitting means promoting those to a shared test module.
baseline_lines = 1328
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "Unit tests plus the real-device offscreen render harness for the WGPU paint bridge."
remediation = [
  "Extract the offscreen render harness (smoke_device, DownscaleSmokeFixture, capture_gpu_frame) into a shared gpu_paint test-support module, then split the render smokes and the dither test out of the unit-test file."
]

[[files]]
path = "src/app/realtime_sr/mod.rs"
kind = "legacy-large"
baseline_lines = 1552
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "Real-time SR runtime renderer plus exact per-model pass metadata."
remediation = [
  "Split the generated per-model pass metadata out of the runtime renderer after NVL variant expansion."
]

[[files]]
path = "src/core/upscale_bench/gpu/cunny.rs"
kind = "legacy-large"
baseline_lines = 1510
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "CuNNy bench runner and exact pass metadata kept together."
remediation = [
  "Split generated pass metadata from the bench runner after NVL variant expansion."
]

[[files]]
path = "src/core/i18n.rs"
kind = "legacy-large"
baseline_lines = 1321
growth_warn_lines = 120
growth_fail_lines = 240
purpose = "Bilingual (ko-KR/en-US) UI string catalog kept side-by-side."
remediation = [
  "Split locale catalogs into per-language modules after translation coverage stabilizes."
]

[[files]]
path = "src/core/worker/decode_ahead.rs"
kind = "legacy-large"
baseline_lines = 901
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "Decode-ahead prefetch: pending-decode lifecycle, scheduling, and the decode worker loop."
remediation = [
  "Split the decode worker thread body and the pending-decode bookkeeping into separate submodules once the prefetch policy settles."
]

[[files]]
path = "src/app/winit_host.rs"
kind = "legacy-large"
baseline_lines = 473
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "Custom winit host root: event loop, reactive control flow, and DPI defense wiring; the Glow/WGPU stage handlers and title-sync live in glow_stage.rs, wgpu_stage.rs, and title_sync.rs."
remediation = [
  "Keep new stage-specific code in the matching submodule (glow_stage.rs, wgpu_stage.rs, or title_sync.rs) rather than the host root."
]

[[files]]
path = "src/app/viewer.rs"
kind = "legacy-large"
# Registered as a ratchet rather than split: the file is one frame of the paged
# viewer, and its remaining pieces are welded to SuiSuiViewApp. page_visual alone
# touches 18 distinct members, so moving it out buys no encapsulation — only a
# second impl block reaching into the same state from another file. Spread math,
# pointer handling, transitions, and the strip already live in submodules.
baseline_lines = 914
growth_warn_lines = 80
growth_fail_lines = 160
purpose = "Paged viewer frame: show_viewer entry, spread paint, page-visual resolution, and the settled-view bookkeeping. Spread math is in model.rs, pointer handling in interaction.rs, page-turn animation in transition.rs, and continuous scroll in strip/."
remediation = [
  "The one real seam is resolve-vs-paint: page_visual + original_texture_only_visual (cache lookup, texture upload, GPU/CPU branch) never touch a Painter, and both paint_spread and strip/view.rs call them. Extract to viewer/visual.rs only if that pair grows its own policy — a move alone trades adjacency for nothing."
]

[[routing]]
name = "App commands and shortcuts"
avoid_paths = ["src/app.rs"]
destination = "src/app/commands.rs"
signals = ["AppCommand", "Shortcut", "TRACKED_KEYS", "command_for_shortcut", "collect_keyboard_commands"]

[[routing]]
name = "App UI panels"
avoid_paths = ["src/app.rs"]
destination = "src/app/ui/"
signals = ["show_toolbar", "show_status_bar", "show_context_menu", "show_settings_window"]

[[routing]]
name = "Viewer rendering"
avoid_paths = ["src/app.rs"]
destination = "src/app/viewer.rs or src/app/render.rs"
signals = ["show_viewer", "paint_spread", "paint_placeholder", "spread_origin", "scale_for"]

[[routing]]
name = "Session image effects"
avoid_paths = ["src/app.rs"]
destination = "src/app/effects.rs"
signals = ["ViewEffects", "ViewTransform", "ImageFilter", "apply_effects_to_image", "transform_image"]

[[routing]]
name = "Platform integration"
avoid_paths = ["src/app.rs"]
destination = "src/app/platform.rs"
signals = ["Clipboard", "FileDialog", "MessageDialog", "reveal_in_file_manager", "install_cjk_font_fallback"]

[[routing]]
name = "Format-specific decode backends"
avoid_paths = ["src/core/worker.rs"]
destination = "src/core/worker/{jpeg,png,bmp,gif}.rs"
signals = ["prepare_image_with_scaled_jpeg", "prepare_image_with_sampled_png", "prepare_image_with_sampled_bmp", "prepare_image_with_sampled_gif"]

[[routing]]
name = "Metadata decode policy"
avoid_paths = ["src/core/worker.rs"]
destination = "src/core/worker/metadata.rs"
signals = ["read_image_metadata", "apply_embedded_icc_to_rgba", "apply_exif_orientation_to_page"]

[[routing]]
name = "Worker scheduling and cache policy"
avoid_paths = ["src/core/worker.rs"]
destination = "src/core/worker/scheduler.rs or src/core/worker/cache.rs"
signals = ["prioritized_jobs", "prioritized_indices", "prune_worker_cache", "clear_cache_on_book_or_decode_change"]

# Waivers should be rare and temporary. Example:
#
# [[waivers]]
# path = "src/app.rs"
# rule = "legacy_growth"
# reason = "Temporary wiring while extracting app/ui modules."
# expires = "2026-06-15"
